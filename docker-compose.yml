version: '3.8'

services:
  krishiseva-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krishiseva-crop-detector
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/backend/uploads
      - app-db:/app/backend/crop_doctor.db
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1

volumes:
  app-data:
  app-db:
